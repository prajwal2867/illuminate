<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illuminate Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static_styles') }}">
</head>
<body>
  <main class="page-shell signin-page-shell">
    <section class="registration-card signin-card" role="dialog" aria-modal="true" aria-labelledby="signin-title">
      <button class="modal-close" type="button" aria-label="Close sign in" onclick="window.location.href='/'">&times;</button>
      <h1 id="signin-title">Illuminate Sign In</h1>

      {% if message %}
        <p class="signin-message {{ message_type }}" role="alert">{{ message }}</p>
      {% endif %}

      <form class="registration-form" method="post" action="{{ url_for('signin_page') }}">
        <label class="field">
          <span>Full Name</span>
          <input type="text" name="full-name" autocomplete="name" required>
        </label>

        <label class="field">
          <span>Illuminate ID</span>
          <input type="text" name="illuminate-id" required>
        </label>

        <label class="field date-field">
          <span>Date of Birth</span>
          <div class="date-input-shell">
            <span class="date-mask" aria-hidden="true">DD / MM / YYYY</span>
            <input id="signin-date-of-birth" type="text" name="date-of-birth" inputmode="numeric" maxlength="14" required aria-label="Date of Birth, day month year">
          </div>
        </label>

        <label class="field input-with-icon">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
          <button class="visibility-toggle" type="button" aria-label="Show password">&#128065;</button>
        </label>

        <button class="register-button signin-button" type="submit">View your Unique QR E-Ticket</button>
      </form>
    </section>
  </main>
  <script>
    const dateOfBirth = document.querySelector('#signin-date-of-birth');
    const dateMask = document.querySelector('.date-mask');

    const updateDateMask = () => {
      const digits = dateOfBirth.value.replace(/\D/g, '').slice(0, 8);
      const dd = digits.slice(0, 2);
      const mm = digits.slice(2, 4);
      const yyyy = digits.slice(4, 8);

      let formatted = dd;
      if (digits.length > 2) formatted += ' / ' + mm;
      if (digits.length > 4) formatted += ' / ' + yyyy;
      if (dateOfBirth.value !== formatted) dateOfBirth.value = formatted;

      const sections = [dd, mm, yyyy];
      const placeholders = ['DD', 'MM', 'YYYY'];
      dateMask.innerHTML = sections.map((section, index) => {
        const remaining = placeholders[index].slice(section.length);
        return `<span class="date-part date-part-${index + 1}"><span class="date-entered">${section}</span><span class="date-remaining">${remaining}</span></span>`;
      }).join('<span class="date-separator"> / </span>');
    };

    dateOfBirth.addEventListener('input', updateDateMask);
    updateDateMask();

    dateOfBirth.addEventListener('keydown', (event) => {
      if (!/[0-9]|Backspace|Delete|ArrowLeft|ArrowRight|Tab/.test(event.key)) {
        event.preventDefault();
      }
    });

    document.querySelector('.visibility-toggle').addEventListener('click', (event) => {
      const password = event.currentTarget.previousElementSibling;
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      event.currentTarget.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
