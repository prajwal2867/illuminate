<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illuminate Registration</title>
  <link rel="stylesheet" href="{{ url_for('static_styles') }}" />
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" role="dialog" aria-modal="true" aria-labelledby="registration-title">
      <button class="modal-close" type="button" aria-label="Close registration">&times;</button>
      <h1 id="registration-title">Illuminate Registration</h1>

      {% if message %}
        <p class="registration-message {{ message_type or 'warning' }}" role="alert">{{ message }}</p>
      {% endif %}

      <form class="registration-form" action="{{ url_for('generate_ticket') }}" method="post">
        <label class="field">
          <span>Full Name</span>
          <input type="text" name="full-name" autocomplete="name" required>
        </label>

        <label class="field">
          <span>Email Address</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>

        <div class="field phone-field">
          <label for="mobile-number">Mobile Number</label>
          <div class="phone-input">
            <button class="country-selector" type="button" aria-label="Select country code">
              <img class="country-flag" src="{{ url_for('india_flag') }}" alt="India">
              <span class="country-chevron" aria-hidden="true"></span>
            </button>
            <input id="mobile-number" type="tel" name="mobile-number" autocomplete="tel" required>
          </div>
        </div>

        <label class="field">
          <span>Enter illuminate ID</span>
          <input type="text" name="illuminate-id" required>
        </label>

        <label class="field input-with-icon">
          <span>Create Password</span>
          <input type="password" name="password" autocomplete="new-password" required>
          <button class="visibility-toggle" type="button" aria-label="Show password">&#128065;</button>
        </label>

        <label class="field input-with-icon">
          <span>Confirm Password</span>
          <input type="password" name="confirm-password" autocomplete="new-password" required>
          <button class="visibility-toggle" type="button" aria-label="Show password">&#128065;</button>
        </label>

        <label class="field date-field">
          <span>Date of Birth</span>
          <div class="date-input-shell">
            <span class="date-mask" aria-hidden="true">DD / MM / YYYY</span>
            <input id="date-of-birth" type="text" name="date-of-birth" inputmode="numeric" autocomplete="bday" maxlength="14" required aria-label="Date of Birth, day month year" placeholder="">
          </div>
        </label>

        <button class="register-button" type="submit">Verify and Generate E-Ticket</button>
      </form>

      <p class="signin-prompt">Already have an Illuminate ID? <a href="{{ url_for('signin_page') }}">Sign in here</a></p>
      <p class="admin-prompt">Admin? <a href="{{ url_for('admin_login') }}">Login here</a></p>
    </section>
  </main>
  <script>
    const dateOfBirth = document.querySelector('#date-of-birth');
    const dateMask = document.querySelector('.date-mask');

    const updateDateMask = () => {
      const digits = dateOfBirth.value.replace(/\D/g, '').slice(0, 8);
      const dd = digits.slice(0, 2);
      const mm = digits.slice(2, 4);
      const yyyy = digits.slice(4, 8);

      let formatted = dd;
      if (digits.length > 2) formatted += ' / ' + mm;
      if (digits.length > 4) formatted += ' / ' + yyyy;
      if (dateOfBirth.value !== formatted) dateOfBirth.value = formatted;

      const sections = [dd, mm, yyyy];
      const placeholders = ['DD', 'MM', 'YYYY'];
      dateMask.innerHTML = sections.map((section, index) => {
        const remaining = placeholders[index].slice(section.length);
        return `<span class="date-part date-part-${index + 1}"><span class="date-entered">${section}</span><span class="date-remaining">${remaining}</span></span>`;
      }).join('<span class="date-separator"> / </span>');
    };

    dateOfBirth.addEventListener('input', updateDateMask);
    updateDateMask();

    dateOfBirth.addEventListener('keydown', (event) => {
      if (!/[0-9]|Backspace|Delete|ArrowLeft|ArrowRight|Tab/.test(event.key)) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
