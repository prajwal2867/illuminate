<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illuminate Registration</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" role="dialog" aria-modal="true" aria-labelledby="registration-title">
      <button class="modal-close" type="button" aria-label="Close registration">&times;</button>
      <h1 id="registration-title">Illuminate Registration</h1>

      <form class="registration-form">
        <label class="field">
          <span>Full Name</span>
          <input type="text" name="full-name" autocomplete="name" required>
        </label>

        <label class="field">
          <span>Email Address</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>

        <div class="field phone-field">
          <label for="mobile-number">Mobile Number</label>
          <div class="phone-input">
            <button class="country-selector" type="button" aria-label="Select country code">
              <img class="country-flag" src="India_flag.png" alt="India">
              <span class="country-chevron" aria-hidden="true"></span>
            </button>
            <input id="mobile-number" type="tel" name="mobile-number" autocomplete="tel" required>
          </div>
        </div>

        <label class="field">
          <span>Enter illuminate ID</span>
          <input type="text" name="illuminate-id" required>
        </label>

        <label class="field input-with-icon">
          <span>Create Password</span>
          <input type="password" name="password" autocomplete="new-password" required>
          <button class="visibility-toggle" type="button" aria-label="Show password">&#128065;</button>
        </label>

        <label class="field input-with-icon">
          <span>Confirm Password</span>
          <input type="password" name="confirm-password" autocomplete="new-password" required>
          <button class="visibility-toggle" type="button" aria-label="Show password">&#128065;</button>
        </label>

        <label class="field date-field">
          <span>Date of Birth</span>
          <input type="date" name="date-of-birth" required>
        </label>

        <button class="register-button" type="submit">REGISTER</button>
      </form>

      <p class="signin-prompt">Already have an Illuminate ID? <a href="#signin">Sign in here</a></p>
    </section>
  </main>
</body>
</html>
